name: CMake Build

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    # The dev branch uses Linux epoll, so it only builds on Linux.
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_C_FLAGS="-Wall"

    - name: Build
      run: cmake --build build

    - name: Test
      run: ctest --test-dir build --output-on-failure

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: client-linux
        path: build/client
